name: Test CargoWall Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:



jobs:
  test-basic-actions-read:
    name: Basic Functionality (Actions Read)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall
        id: cargowall
        uses: ./
        with:
          offline: 'true'
          allowed-hosts: |
            github.com
            githubusercontent.com
            api.github.com

      - name: Verify pid output is the real cargowall process (not the sudo wrapper)
        run: |
          PID='${{ steps.cargowall.outputs.pid }}'
          test -n "$PID"
          # /proc/<pid>/comm is world-readable, so ps works without sudo.
          COMM=$(ps -o comm= -p "$PID" | tr -d '[:space:]')
          echo "pid=$PID comm=$COMM"
          if [ "$COMM" != "cargowall" ]; then
            echo "ERROR: pid output should be the cargowall process, got '$COMM'"
            exit 1
          fi

      - name: Test allowed connection (github.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

      - name: Test allowed connection (api.github.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://api.github.com

      - name: Test blocked connection (example.com)
        run: |
          if curl -sf --max-time 5 https://example.com > /dev/null 2>&1; then
            echo "ERROR: example.com should be blocked"
            exit 1
          fi
          echo "Correctly blocked example.com"

      - name: Test blocked connection (httpbin.org)
        run: |
          if curl -sf --max-time 5 https://httpbin.org > /dev/null 2>&1; then
            echo "ERROR: httpbin.org should be blocked"
            exit 1
          fi
          echo "Correctly blocked httpbin.org"

  test-basic-no-actions-read:
    name: Basic Functionality (No Actions Read)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall
        uses: ./
        with:
          offline: 'true'
          skip-actions-api: 'true'
          allowed-hosts: |
            github.com
            githubusercontent.com
            api.github.com

      - name: Test allowed connection (github.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

      - name: Test allowed connection (api.github.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://api.github.com

      - name: Test blocked connection (example.com)
        run: |
          if curl -sf --max-time 5 https://example.com > /dev/null 2>&1; then
            echo "ERROR: example.com should be blocked"
            exit 1
          fi
          echo "Correctly blocked example.com"

      - name: Test blocked connection (httpbin.org)
        run: |
          if curl -sf --max-time 5 https://httpbin.org > /dev/null 2>&1; then
            echo "ERROR: httpbin.org should be blocked"
            exit 1
          fi
          echo "Correctly blocked httpbin.org"

  test-dns-filtering:
    name: DNS Tunneling Prevention
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall with strict hosts
        uses: ./
        with:
          allowed-hosts: |
            app.codecargo.com
            github.com
            api.github.com



      - name: Test allowed DNS query
        run: |
          nslookup github.com 127.0.0.1 || true
          echo "DNS query for github.com completed"

      - name: Test blocked DNS query (should be refused)
        run: |
          # DNS queries for non-allowed domains should be refused
          # This prevents DNS tunneling attacks
          if nslookup attacker-domain-12345.com 127.0.0.1 2>/dev/null; then
            # nslookup might return 0 even on REFUSED, check output
            OUTPUT=$(nslookup attacker-domain-12345.com 127.0.0.1 2>&1 || true)
            if echo "$OUTPUT" | grep -qi "refused\|SERVFAIL\|error\|timed out"; then
              echo "DNS query correctly refused/failed"
            else
              echo "WARNING: DNS query may have succeeded unexpectedly"
            fi
          else
            echo "DNS query correctly refused"
          fi

  test-cidr-rules:
    name: CIDR-Based Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall with CIDR rules
        uses: ./
        with:
          allowed-cidrs: |
            "140.82.112.0/20"  # GitHub's IP range
          allowed-hosts: |
            app.codecargo.com

      - name: Test connection to allowed CIDR (github.com IPs)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

  test-graceful-degradation:
    name: Graceful Degradation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall (should not fail even if issues)
        id: cargowall
        uses: ./
        with:
          allowed-hosts: |
            app.codecargo.com
            github.com
          fail-on-unsupported: false

      - name: Check if supported
        run: |
          echo "CargoWall supported: ${{ steps.cargowall.outputs.supported }}"

  test-docker-integration:
    name: Docker DNS Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall
        uses: ./
        with:
          allowed-hosts: |
            github.com
            app.codecargo.com
            docker.io
            docker.com
            registry-1.docker.io
            auth.docker.io
            production.cloudflare.docker.com

      - name: Test Docker pull (should work)
        run: |
          docker pull alpine:latest
          echo "Docker pull succeeded"

      - name: Test Docker run with DNS filtering
        run: |
          # Run a container that tries to reach a blocked host
          docker run --rm alpine:latest sh -c "
            if wget -q --timeout=5 -O /dev/null https://example.com 2>/dev/null; then
              echo 'ERROR: example.com should be blocked inside container'
              exit 1
            fi
            echo 'Correctly blocked example.com inside container'
          " || echo "Container test completed"

  test-single-label-wildcard:
    name: Single-Label Wildcard (*)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup CargoWall with single-label wildcard
        uses: ./
        with:
          offline: 'true'
          allowed-hosts: |
            *.ubuntu.com

      - name: Test allowed connection (archive.ubuntu.com matches *.ubuntu.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://archive.ubuntu.com

      - name: Test allowed connection (security.ubuntu.com matches *.ubuntu.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://security.ubuntu.com

      - name: Test bare domain not matched (ubuntu.com should not match *.ubuntu.com)
        run: |
          if curl -sf --max-time 5 https://ubuntu.com > /dev/null 2>&1; then
            echo "ERROR: ubuntu.com should not match *.ubuntu.com (requires exactly one label)"
            exit 1
          fi
          echo "Correctly blocked ubuntu.com (not matched by *.ubuntu.com)"

      - name: Test blocked connection (httpbin.org)
        run: |
          if curl -sf --max-time 5 https://httpbin.org > /dev/null 2>&1; then
            echo "ERROR: httpbin.org should be blocked"
            exit 1
          fi
          echo "Correctly blocked httpbin.org"

  test-globstar-wildcard:
    name: Globstar Wildcard (**)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup CargoWall with globstar wildcard
        uses: ./
        with:
          offline: 'true'
          allowed-hosts: |
            **.ubuntu.com

      - name: Test 2 labels deep matches **.ubuntu.com (gb.archive.ubuntu.com)
        run: |
          # Assert cargowall's DNS verdict, not an end-to-end connection. Canonical's
          # archive mirrors round-robin through 185.125.190.0/24, which GitHub's Azure
          # runners can't reach on :443, and curl does NOT fail over to another A
          # record on a connect timeout — so gb.archive.ubuntu.com, whose addresses
          # are entirely in that range, can never complete a TCP handshake here.
          # With the --github-action preset's DNS query filtering on and no search
          # domain configured, a matched name is resolved by the proxy and an
          # unmatched one is REFUSED, so resolution is a precise match signal.
          # (us.archive.ubuntu.com, the old host, was retired by Canonical.)
          OUTPUT=$(nslookup gb.archive.ubuntu.com 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "refused"; then
            echo "ERROR: gb.archive.ubuntu.com (2 labels deep) should match **.ubuntu.com, but was REFUSED"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qi "^Name:"; then
            echo "ERROR: expected gb.archive.ubuntu.com to resolve through the proxy (globstar match), but it did not"
            exit 1
          fi
          echo "**.ubuntu.com matched gb.archive.ubuntu.com (2 labels deep): allowed and resolved"

      - name: Test 1 label deep matches **.ubuntu.com (archive.ubuntu.com)
        run: |
          OUTPUT=$(nslookup archive.ubuntu.com 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "refused"; then
            echo "ERROR: archive.ubuntu.com (1 label deep) should match **.ubuntu.com, but was REFUSED"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qi "^Name:"; then
            echo "ERROR: expected archive.ubuntu.com to resolve through the proxy (globstar match), but it did not"
            exit 1
          fi
          echo "**.ubuntu.com matched archive.ubuntu.com (1 label deep): allowed and resolved"

      - name: Test bare domain not matched (ubuntu.com should not match **.ubuntu.com)
        run: |
          if curl -sf --max-time 5 https://ubuntu.com > /dev/null 2>&1; then
            echo "ERROR: ubuntu.com should not match **.ubuntu.com (requires one or more labels)"
            exit 1
          fi
          echo "Correctly blocked ubuntu.com (not matched by **.ubuntu.com)"

      - name: Test blocked connection (httpbin.org)
        run: |
          if curl -sf --max-time 5 https://httpbin.org > /dev/null 2>&1; then
            echo "ERROR: httpbin.org should be blocked"
            exit 1
          fi
          echo "Correctly blocked httpbin.org"

  test-mixed-wildcards:
    name: Mixed Wildcard Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup CargoWall with mixed wildcards
        uses: ./
        with:
          offline: 'true'
          allowed-hosts: |
            *.ubuntu.com

      # Assert cargowall's DNS verdict rather than a connection: with query
      # filtering on (the --github-action preset) and no search domain, a name not
      # matched by any rule is REFUSED at the proxy. gb.archive.ubuntu.com is 2
      # labels deep, so *.ubuntu.com (single label only) must NOT match it. The
      # verdict avoids a false pass — gb.archive's IPs are all in Canonical's
      # unreachable 185.125.190.0/24, so a plain curl would "fail to connect" even
      # if the name were wrongly allowed (the retired us.archive.ubuntu.com passed
      # this vacuously for the same reason).
      - name: Test 2-labels-deep name refused (gb.archive.ubuntu.com not matched by *.ubuntu.com)
        run: |
          OUTPUT=$(nslookup gb.archive.ubuntu.com 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -qi "refused"; then
            echo "ERROR: gb.archive.ubuntu.com should be REFUSED (*.ubuntu.com only matches 1 label)"
            exit 1
          fi
          echo "Correctly refused gb.archive.ubuntu.com (*.ubuntu.com does not match 2 labels deep)"

      - name: Test single-label wildcard matches (archive.ubuntu.com via *.ubuntu.com)
        run: |
          OUTPUT=$(nslookup archive.ubuntu.com 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "refused"; then
            echo "ERROR: archive.ubuntu.com should match *.ubuntu.com, but was REFUSED"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -qi "^Name:"; then
            echo "ERROR: expected archive.ubuntu.com to resolve through the proxy (*.ubuntu.com match), but it did not"
            exit 1
          fi
          echo "*.ubuntu.com matched archive.ubuntu.com: allowed and resolved"

      - name: Test blocked connection (httpbin.org)
        run: |
          if curl -sf --max-time 5 https://httpbin.org > /dev/null 2>&1; then
            echo "ERROR: httpbin.org should be blocked"
            exit 1
          fi
          echo "Correctly blocked httpbin.org"

  test-search-domains:
    name: DNS Search Domains
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall with search domains
        uses: ./
        with:
          offline: 'true'
          # `archive` is a bare single-label rule that only matches a real host
          # once the `.ubuntu.com` search-domain suffix is stripped before matching.
          allowed-hosts: |
            archive
          search-domains: |
            .ubuntu.com

      - name: Test suffix stripping enables rule match (archive.ubuntu.com -> archive)
        run: |
          # This check must stay end-to-end. A name under the .ubuntu.com search
          # domain that does NOT match a rule is BYPASSED (forwarded and resolved),
          # so a DNS-only probe can't tell a real `archive` rule match from a bypass
          # — only a completed connection proves the resolved IPs were allowlisted.
          # Without search-domains the bare `archive` rule would not cover
          # archive.ubuntu.com; it connects only because `.ubuntu.com` is stripped
          # to `archive`, which matches. Canonical's mirrors round-robin through an
          # 185.125.190.0/24 range these Azure runners can't reach on :443, and curl
          # does not fail over across A records on a connect timeout, so retry to get
          # a re-resolution that fronts a reachable (91.189.x) IP; -4 skips the dead
          # IPv6 path.
          ok=""
          for i in 1 2 3 4 5; do
            if curl -sf -4 --connect-timeout 5 --max-time 15 https://archive.ubuntu.com > /dev/null; then
              ok=1; break
            fi
            echo "attempt $i: archive.ubuntu.com mirror IP unreachable, retrying"
            sleep 3
          done
          [ -n "$ok" ] || { echo "ERROR: archive.ubuntu.com unreachable after retries; suffix-strip match unverified"; exit 1; }
          echo "Connected to archive.ubuntu.com (.ubuntu.com stripped -> matched 'archive' rule)"

      - name: Test bypass for an unmatched name under a search domain (forwarded, not refused)
        run: |
          # A made-up label under the .ubuntu.com search domain has no host rule, so
          # the proxy must BYPASS query filtering and forward it upstream rather than
          # refuse it as DNS tunneling. A non-existent label is used deliberately: it
          # has no CNAME chain to escape the suffix, so bypass -> upstream NXDOMAIN,
          # whereas a refusal (REFUSED) would mean bypass did not apply.
          OUTPUT=$(nslookup nonexistent-cargowall-bypass-test.ubuntu.com 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "REFUSED"; then
            echo "ERROR: a name under the search domain should be bypassed (forwarded), not REFUSED"
            exit 1
          fi
          echo "Correctly bypassed DNS query for a name under the search domain"

      - name: Test name outside any search domain is still refused (DNS tunneling guard)
        run: |
          # No host rule and not under a search domain -> the proxy refuses it.
          # `.example` is a reserved TLD, so this can never resolve for real.
          OUTPUT=$(nslookup blocked-cargowall-test.example 127.0.0.1 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "REFUSED"; then
            echo "Correctly refused DNS query for an off-suffix, unmatched name"
          else
            echo "ERROR: an off-suffix, unmatched name should be REFUSED"
            exit 1
          fi

  test-sudo-lockdown:
    name: Sudo Lockdown
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall with sudo lockdown
        id: cargowall
        uses: ./
        with:
          allowed-hosts: |
            app.codecargo.com
            github.com
            archive.ubuntu.com
            security.ubuntu.com
          sudo-lockdown: true
          sudo-allow-commands: /usr/bin/apt-get
          # Make a false "exited unexpectedly" liveness verdict a hard failure.
          # Under lockdown the action can't probe liveness via sudo, so this
          # guards the tri-state 'unknown' path (must wait for the sentinel, not
          # crash) as well as the no-sudo pidfile read below.
          fail-on-unsupported: true

      - name: Verify real PID is tracked under sudo-lockdown
        run: |
          # The pidfile is 0644, so an unprivileged step reads it even under
          # lockdown; the action must report that same (real) PID, not the wrapper.
          OUT='${{ steps.cargowall.outputs.pid }}'
          FILE=$(cat /tmp/cargowall.pid)
          echo "output=$OUT file=$FILE"
          test -n "$OUT"
          test "$OUT" = "$FILE"
          ps -o comm= -p "$OUT" | tr -d '[:space:]' | grep -qx cargowall

      - name: Test apt-get works
        run: |
          sudo apt-get update || echo "apt update completed (may have partial failures due to network restrictions)"

      - name: Test iptables is blocked
        run: |
          if sudo iptables -L 2>/dev/null; then
            echo "WARNING: iptables access may not be fully blocked"
          else
            echo "Correctly blocked iptables"
          fi

  test-stale-startup-files:
    name: Stale Startup Files (reused runner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Plant stale ready/pid files (simulate a prior run on a reused runner)
        run: |
          # Root-owned, like the files cargowall leaves behind. Without the
          # action clearing them, the stale ready sentinel would short-circuit the
          # wait and the stale dead PID would trip a false "exited" verdict.
          echo 999999 | sudo tee /tmp/cargowall.pid > /dev/null
          sudo touch /tmp/cargowall-ready
          ls -l /tmp/cargowall.pid /tmp/cargowall-ready

      - name: Setup CargoWall
        id: cargowall
        uses: ./
        with:
          offline: 'true'
          fail-on-unsupported: true
          allowed-hosts: |
            github.com
            api.github.com

      - name: Verify clean start despite stale files
        run: |
          test '${{ steps.cargowall.outputs.supported }}' = 'true'
          PID='${{ steps.cargowall.outputs.pid }}'
          echo "pid=$PID"
          test -n "$PID"
          # Must be the real cargowall PID, not the planted stale 999999.
          test "$PID" != "999999"
          ps -o comm= -p "$PID" | tr -d '[:space:]' | grep -qx cargowall

      - name: Test allowed connection (github.com)
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

      - name: Test blocked connection (example.com)
        run: |
          if curl -sf --max-time 5 https://example.com > /dev/null 2>&1; then
            echo "ERROR: example.com should be blocked"
            exit 1
          fi
          echo "Correctly blocked example.com"

  test-fail-on-unsupported-cleanup:
    name: Fail-on-unsupported restores DNS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake cargowall that records its PID then exits
        run: |
          # Stand-in binary: writes the pidfile cargowall would, then exits
          # without ever writing the ready sentinel. The action sees a real but
          # dead PID -> 'dead' liveness -> startup failure. With
          # fail-on-unsupported the action must throw AND restore resolv.conf
          # (which start() repointed at 127.0.0.1 before launching).
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'for a in "$@"; do case "$a" in --pidfile=*) echo "$$" > "${a#--pidfile=}";; esac; done' \
            'exit 0' > /tmp/fake-cargowall
          chmod +x /tmp/fake-cargowall

      - name: Capture DNS before
        run: cat /etc/resolv.conf

      - name: Setup CargoWall (expected to fail)
        id: cw
        continue-on-error: true
        uses: ./
        with:
          offline: 'true'
          binary-path: /tmp/fake-cargowall
          fail-on-unsupported: true
          allowed-hosts: github.com

      - name: Assert startup failed and DNS was restored
        run: |
          if [ '${{ steps.cw.outcome }}' != 'failure' ]; then
            echo "ERROR: expected the action to fail, got '${{ steps.cw.outcome }}'"
            exit 1
          fi
          echo "resolv.conf after:"; cat /etc/resolv.conf
          if grep -qF 'nameserver 127.0.0.1' /etc/resolv.conf; then
            echo "ERROR: /etc/resolv.conf still points at cargowall's proxy (DNS not restored)"
            exit 1
          fi
          # DNS must actually resolve again.
          getent hosts github.com

  # --- api-failure-mode (#69) ------------------------------------------------
  # These run the REAL binary against a local stub API. Unit tests cover the
  # action's decision logic, but only these catch a flag the pinned cargowall
  # does not accept — kong exits on an unknown flag, so a rename would pass
  # every unit test and break every real run.

  test-api-failure-audit-downgrade:
    name: API failure downgrades to audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start a policy API stub that always 503s
        uses: ./.github/actions/policy-stub
        with:
          status: '503'

      - name: Setup CargoWall
        id: cargowall
        uses: ./
        with:
          # mode and api-failure-mode both unset: the default posture is audit.
          api-url: http://127.0.0.1:8099
          allowed-hosts: |
            github.com
            api.github.com

      - name: Assert the run came up and was downgraded to audit
        run: |
          test '${{ steps.cargowall.outputs.supported }}' = 'true'

          echo "mode file:"; cat /tmp/cargowall-mode
          if [ "$(cat /tmp/cargowall-mode)" != "audit" ]; then
            echo "ERROR: expected effective mode 'audit'"
            exit 1
          fi

          echo "downgrade record:"; cat /tmp/cargowall-downgrade
          grep -q 'CARGO_WALL_DOWNGRADE_TYPE_AUDIT_FALLBACK' /tmp/cargowall-downgrade

          # audit-summary defaults to true here, but the log must exist either
          # way — see the audit-summary:false assertion below.
          test -f /tmp/cargowall-audit.json

      - name: Verify audit posture reaches the DNS datapath
        run: |
          # example.com is not in allowed-hosts. In audit mode the DNS proxy
          # must not refuse it — half of the split that made
          # audit-summary:false look like enforcement.
          getent hosts example.com

      - name: Verify audit posture reaches the eBPF datapath
        # The other half: the eBPF layer must not block the connection either.
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://example.com

  test-api-failure-not-onboarded:
    name: API 404 does not change posture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start a policy API stub that always 404s
        uses: ./.github/actions/policy-stub
        with:
          status: '404'

      - name: Setup CargoWall
        id: cargowall
        uses: ./
        with:
          # Explicitly asking for the audit downgrade — it must STILL not fire,
          # because a 404 means "not onboarded", not "the API is down". This is
          # what keeps the audit default safe for everyone without an account.
          api-failure-mode: audit
          api-url: http://127.0.0.1:8099
          allowed-hosts: |
            github.com
            api.github.com

      - name: Assert no downgrade was recorded
        run: |
          test '${{ steps.cargowall.outputs.supported }}' = 'true'

          if [ -f /tmp/cargowall-downgrade ]; then
            echo "ERROR: a 404 must not produce a downgrade record"
            cat /tmp/cargowall-downgrade
            exit 1
          fi

      - name: Assert github.com is still allowed
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

      - name: Assert example.com is still blocked
        run: |
          if curl -sf --max-time 5 https://example.com > /dev/null 2>&1; then
            echo "ERROR: example.com should still be blocked — posture was downgraded on an authoritative 404"
            exit 1
          fi
          echo "example.com still blocked, as enforcement requires"

  test-api-failure-lockdown:
    name: api-failure-mode fail locks down and fails the step
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start a policy API stub that always 503s
        uses: ./.github/actions/policy-stub
        with:
          status: '503'

      - name: Setup CargoWall (expected to fail)
        id: cargowall
        continue-on-error: true
        uses: ./
        with:
          api-failure-mode: fail
          api-url: http://127.0.0.1:8099
          # fail-on-unsupported is deliberately left at its default (false):
          # api-failure-mode: fail must fail the step regardless of it.
          allowed-hosts: |
            github.com
            api.github.com

      - name: Assert lockdown was reported promptly
        run: |
          if [ '${{ steps.cargowall.outcome }}' != 'failure' ]; then
            echo "ERROR: expected the action to fail, got '${{ steps.cargowall.outcome }}'"
            exit 1
          fi

          # The failure sentinel is what makes this immediate rather than a
          # 30-second readiness timeout.
          echo "failure sentinel:"; cat /tmp/cargowall-failed
          grep -q 'policy lockdown' /tmp/cargowall-failed

          # Pin the sentinel format contract the action's parser relies on:
          # first line is the writer's pid stamp, and on the lockdown path
          # (process alive, pidfile written) it matches the real pid.
          head -1 /tmp/cargowall-failed | grep -Eq '^pid=[0-9]+$'
          test "$(head -1 /tmp/cargowall-failed)" = "pid=$(cat /tmp/cargowall.pid)"

          # Ready is withheld on purpose: "ready" means the requested policy is
          # enforced, and it is not.
          if [ -f /tmp/cargowall-ready ]; then
            echo "ERROR: ready sentinel must be withheld in lockdown"
            exit 1
          fi

          # Lockdown invariant: the process stays ALIVE holding the runner at
          # deny-all, and DNS stays pointed at cargowall's proxy — the action
          # must not have restored resolv.conf out from under it.
          sudo kill -0 "$(cat /tmp/cargowall.pid)"
          grep -qF 'nameserver 127.0.0.1' /etc/resolv.conf

  test-audit-summary-false-still-collects:
    name: audit-summary false still collects events (#71)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup CargoWall with the summary disabled
        id: cargowall
        uses: ./
        with:
          offline: 'true'
          audit-summary: 'false'
          allowed-hosts: |
            github.com
            api.github.com

      - name: Generate some traffic
        uses: ./.github/actions/assert-egress-allowed
        with:
          url: https://github.com

      - name: Assert events are still collected
        run: |
          test '${{ steps.cargowall.outputs.supported }}' = 'true'
          # audit-summary controls RENDERING only. Gating collection on it left
          # these jobs with no events and no dashboard record at all.
          if [ ! -s /tmp/cargowall-audit.json ]; then
            echo "ERROR: audit log missing or empty with audit-summary: false"
            ls -l /tmp/cargowall-audit.json || true
            exit 1
          fi
          echo "audit log has $(wc -l < /tmp/cargowall-audit.json) events"
