name: 'CargoWall eBPF Firewall'
description: 'Secure GitHub Actions runners with eBPF-based network egress filtering'
author: 'CodeCargo'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  mode:
    # Deliberately no `default:` — the runner materialises defaults into INPUT_*
    # exactly like caller-supplied values, so declaring one here would make an
    # explicit `mode: enforce` indistinguishable from the default. start.ts
    # applies the default instead, which lets `api-failure-mode` respect a mode
    # the caller actually asked for. Keep the default documented here.
    description: 'Enforcement mode: "enforce" (block connections) or "audit" (log only, no blocking). Default: enforce'
    required: false
  api-failure-mode:
    # No `default:` for the same reason as `mode` above: an explicitly supplied
    # value must win over an explicitly supplied `mode`, which needs the two
    # apart. start.ts defaults this to "audit".
    description: >-
      Posture when the policy cannot be retrieved from the CodeCargo API:
      "audit" (downgrade to audit mode — log, don't block — so the job completes and the degraded run is visible on the dashboard; note this means an unreachable API disables blocking, see README),
      "enforce" (use the policy from this step as-is), or
      "fail" (lock the runner down to deny-all and fail the step).
      Only genuine retrieval failures act on this — an unreachable API, a server
      error, or an unusable policy. A repository that is not onboarded to
      CodeCargo, a rejected token, or an inactive repository always falls back
      to this step's configuration regardless of this setting.
      When `offline: true` or `api-url` is empty the posture is never applied
      (no fetch happens), but the value is still validated — a typo fails the
      step immediately rather than surfacing as a silent posture choice later.
      Default: audit, except when `mode` is explicitly set (see README)
    required: false
  allowed-hosts:
    description: 'Allowed hostnames, one per line (auto matches subdomains example.com would also match api.example.com)'
    required: false
  allowed-cidrs:
    description: 'Allowed CIDR blocks, one per line'
    required: false
  search-domains:
    description: 'DNS search-domain suffixes to strip before hostname-rule matching and bypass for unmatched DNS queries (e.g. .compute.internal), one per line. Each suffix needs at least two labels and cannot be a public suffix.'
    required: false
  github-service-hosts:
    description: 'GitHub service hostnames to auto-allow on port 443 (one per line)'
    required: false
    default: |
      github.com
      api.github.com
      githubapp.com
      actions.githubusercontent.com
      release-assets.githubusercontent.com
      avatars.githubusercontent.com
      github.githubassets.com
  azure-infra-hosts:
    description: 'Azure infrastructure hostnames to auto-allow on port 443 (one per line)'
    required: false
    default: |
      trafficmanager.net
      blob.core.windows.net
  config-file:
    description: 'Path to YAML/JSON config file for advanced rules'
    required: false
  fail-on-unsupported:
    description: 'Fail the workflow if eBPF is not supported (vs warn and continue)'
    default: 'false'
  sudo-lockdown:
    description: 'Enable sudo lockdown to prevent firewall bypass'
    default: 'false'
  sudo-allow-commands:
    description: 'Command paths to allow via sudo when lockdown is enabled, one per line (e.g. /usr/bin/apt-get)'
    default: ''
  dns-upstream:
    description: 'Upstream DNS server for forwarding queries (auto-detected from /etc/resolv.conf if not set)'
    default: ''
  allow-existing-connections:
    description: 'Allow pre-existing TCP connections at startup (prevents blocking connections established before cargowall)'
    default: 'true'
  binary-path:
    description: 'Path to a pre-built cargowall binary. Skips the download and the action''s checksum/provenance verification — the binary is used as given, so verify it in the step that fetches it'
    required: false
  source-ref:
    description: 'Build cargowall from source at this branch/tag of code-cargo/cargowall instead of downloading a release (testing only; no checksum/provenance verification). binary-path takes precedence.'
    required: false
  debug:
    description: 'Enable debug logging'
    default: 'false'
  audit-summary:
    description: 'Render the audit summary into the workflow run summary. Rendering only — event collection and the CodeCargo API push happen regardless (use `offline: true` to stop API communication)'
    default: 'true'
  github-token:
    description: 'GitHub token used to retry the binary download authenticated when the anonymous request is throttled (403/503). The action makes no other GitHub API calls — step attribution needs no permissions.'
    default: ${{ github.token }}
  api-url:
    description: 'CodeCargo API URL for audit upload and policy fetch (policy requires CodeCargo GitHub App installation). Requires permissions: id-token: write'
    required: false
    default: 'https://app.codecargo.com'
  offline:
    description: 'Skip all CodeCargo API communication (audit upload and policy fetch)'
    default: 'false'
  skip-policy-fetch:
    description: >-
      Skip only the CodeCargo policy fetch, so the job runs exactly this step's
      configuration (a fetched policy would replace it). Unlike `offline`, the
      audit push in the post step still runs, keeping the job visible on the
      dashboard — the push needs `permissions: id-token: write` and the
      firewall rules must allow the `api-url` host. `api-failure-mode` never
      applies (no fetch happens) but is still validated. `offline: true` wins
      over this input.
    default: 'false'
  job-id:
    description: 'The check run ID of the current job (populated from the workflow context by default; override if needed)'
    default: ${{ job.check_run_id }}
  container-egress:
    # Experimental knobs for the v2 preview — see README. Deliberately no
    # `default:` on either: an unset input must leave the flag off the command
    # line entirely so the `--github-action` preset stays the single source of
    # the default posture, rather than the action pinning a second copy of it
    # that can drift from the binary's.
    description: >-
      EXPERIMENTAL (v2 preview — may change or be removed): root-cgroup egress
      hook posture. "observe" correlates Docker containers and execs to
      workflow steps and reports what the hook would block, blocking nothing;
      "enforce" makes that hook authoritative for traffic with a local socket
      (pre-NAT, in socket context), with the TC egress hook remaining the
      backstop. Unset keeps the GitHub Actions preset's "observe" — the preset
      raises "off" to "observe", so the hook cannot be turned off from here.
    required: false
  tls-sni:
    description: >-
      EXPERIMENTAL (v2 preview — may change or be removed): L7
      destination-identity posture (TLS SNI / HTTP Host / QUIC), which pins
      WHICH hostname a flow to a shared CDN or edge IP may reach. "off"
      (default), "observe" (parse the presented name and record what it would
      drop, dropping nothing), "enforce" (drop flows whose name no rule allows
      on that IP), "enforce-pinned" (also drop when the name never resolved to
      that destination). The enforce rungs require `container-egress: enforce`.
    required: false

outputs:
  supported:
    description: 'Whether eBPF firewall was successfully activated'
  pid:
    description: 'Process ID of the running cargowall instance'

runs:
  using: 'node24'
  main: 'dist/main/index.js'
  post: 'dist/post/index.js'
  post-if: 'always()'
